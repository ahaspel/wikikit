<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofreading Desk</title>
<style>
  :root {
    --paper: #faf6ee; --ink: #2b241c; --muted: #6b5e4f; --rule: #d8cdb8;
    --panel: #fffdf8; --accent: #7a3b12; --ok: #2f6b2f; --warn: #9a5b00; --bad: #a12a2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--rule); padding: 8px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, button { font: inherit; }
  select { max-width: 22em; padding: 3px 4px; }
  button { padding: 3px 10px; border: 1px solid var(--rule); background: #fff;
           border-radius: 4px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); margin-left: auto; }
  #status.dirty { color: var(--warn); }
  #status.error { color: var(--bad); }
  #status.saved { color: var(--ok); }
  .palette { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .palette button { padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .heads { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);
           gap: 12px; margin-top: 6px; color: var(--muted); font-size: 12px;
           text-transform: uppercase; letter-spacing: .05em; }
  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);
         gap: 12px; padding: 12px 16px 40vh; align-items: start; }
  .orig { grid-column: 1; }
  .src { grid-column: 3; }
  .rendered { grid-column: 2; align-self: stretch; }
  .rendered > div { position: sticky; top: var(--hh, 100px);
                    height: calc(100vh - var(--hh, 100px) - 12px); }
  .rendered iframe { width: 100%; height: 100%; border: 1px solid var(--rule);
                     background: #fff; border-radius: 4px; }
  .tag { font-size: 12px; color: var(--muted); margin: 0 0 3px; display: flex; gap: 8px;
         align-items: center; }
  .orig img { width: 100%; display: block; border: 1px solid var(--rule); background: #fff;
              cursor: zoom-in; }
  .orig img.zoom { width: auto; max-width: none; cursor: zoom-out; }
  .orig .frame { overflow-x: auto; }
  textarea { width: 100%; min-height: 4em; resize: vertical; padding: 6px;
             border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink);
             font: 13px/1.45 Consolas, "DejaVu Sans Mono", monospace; overflow: hidden; }
  textarea:focus { outline: 2px solid #c9a46b; }
  .src.done textarea { background: #f4f9f1; }
  .check { margin-left: auto; display: flex; gap: 4px; align-items: center; color: var(--ink); }
  .figure-note { color: var(--muted); font-style: italic; padding: 6px 0; }
  .empty { padding: 40px 16px; color: var(--muted); }
  @media (max-width: 900px) {
    .heads { display: none; }
    main { grid-template-columns: minmax(0,1fr); }
    .orig, .src, .rendered { grid-column: 1; }
    .rendered { grid-row: auto !important; }
    .rendered > div { position: static; height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Proofreading Desk</h1>
    <button id="prev" title="Previous page">◀</button>
    <select id="pages" aria-label="Page"></select>
    <button id="next" title="Next page">▶</button>
    <a id="ws" target="_blank" rel="noopener">Wikisource</a>
    <span id="status"></span>
    <button id="revert" title="Throw away this page's unsaved changes: back to the page as saved">Revert</button>
    <button id="undo" title="Put the page back as it was before its last save">Undo save</button>
    <button id="save" class="primary" title="Save (Ctrl+S)">Save</button>
  </div>
  <div class="palette" id="palette"></div>
  <div class="heads"><div>Original</div><div>Rendered (as the page would enter)</div><div>Source</div></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const state = { queue: [], page: null, edits: {}, previewTimer: 0, previewN: 0, lastFocus: null, led: null };
const key = (v, p) => `${v}-${p}`;

function setStatus(text, cls = "") { const s = $("status"); s.textContent = text; s.className = cls; }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ── the queue ──────────────────────────────────────────────────────────
function queueLabel(q) {
  const k = key(q.volume, q.page);
  const mark = q.level >= 3 ? "✓ proofread" : `${q.checked}/${q.strips} checked`;
  return `${q.label} — ${mark}${state.edits[k] ? " • unsaved" : ""}`;
}
function drawQueue() {
  const sel = $("pages");
  sel.innerHTML = "";
  state.queue.forEach((q, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = queueLabel(q);
    sel.appendChild(o);
  });
  if (state.page) sel.value = state.queue.findIndex(q => q.volume === state.page.volume && q.page === state.page.page);
}
async function loadQueue() {
  state.queue = await api("/desk/api/queue");
  drawQueue();
}

// ── one page ───────────────────────────────────────────────────────────
function pageEdits() { return state.edits[key(state.page.volume, state.page.page)]; }
function currentStrips() {
  // {name: {text, status}} for every text strip, as the editor holds it
  const out = {};
  for (const s of state.page.strips) {
    if (s.kind === "figure") continue;
    const e = (pageEdits() || {})[s.name];
    // base: the reading as this page was loaded — the server refuses the save
    // if the reading on file is no longer it
    out[s.name] = { text: e ? e.text : s.text, base: e ? e.base : s.text,
                    status: (e ? e.checked : s.checked) ? "checked" : "unchecked" };
  }
  return out;
}

function autosize(ta) { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }

function drawPage() {
  const pg = state.page, main = $("main");
  main.innerHTML = "";
  $("ws").href = pg.wikisource || "#";
  $("ws").style.visibility = pg.wikisource ? "visible" : "hidden";
  let row = 1;
  const edits = pageEdits() || {};
  for (const s of pg.strips) {
    const orig = document.createElement("div");
    orig.className = "orig"; orig.style.gridRow = row;
    const label = s.kind === "head" ? "running head" : s.kind === "figure" ? `figure ${s.name}` : `column ${s.column} · ${s.name}`;
    orig.innerHTML = `<div class="tag">${label}</div><div class="frame"><img alt="${s.name}" loading="lazy"></div>`;
    const img = orig.querySelector("img");
    img.src = s.img;
    img.addEventListener("click", () => img.classList.toggle("zoom"));
    main.appendChild(orig);

    const src = document.createElement("div");
    src.className = "src"; src.style.gridRow = row;
    if (s.kind === "figure") {
      src.innerHTML = `<div class="figure-note">Figure: set on the page where its [[FIGURE]] mark stands.</div>`;
    } else {
      const e = edits[s.name];
      const checked = e ? e.checked : s.checked;
      src.innerHTML = `<div class="tag">${label}<label class="check"><input type="checkbox"> checked against the original</label></div><textarea spellcheck="false"></textarea>`;
      const ta = src.querySelector("textarea"), cb = src.querySelector("input");
      ta.value = e ? e.text : (s.text || "");
      cb.checked = checked;
      src.classList.toggle("done", checked);
      ta.addEventListener("focus", () => { state.lastFocus = ta; });
      ta.addEventListener("input", () => { edit(s, { text: ta.value }); autosize(ta); });
      cb.addEventListener("change", () => { edit(s, { checked: cb.checked }); src.classList.toggle("done", cb.checked); });
      requestAnimationFrame(() => autosize(ta));
    }
    main.appendChild(src);
    row++;
  }
  const rendered = document.createElement("div");
  rendered.className = "rendered";
  rendered.style.gridRow = `1 / ${row}`;
  rendered.innerHTML = `<div><iframe title="The page rendered as it would enter"></iframe></div>`;
  main.appendChild(rendered);
  state.frame = rendered.querySelector("iframe");
  refreshFrame();
  drawPalette();
  updateStatus();
}

function edit(strip, change) {
  const k = key(state.page.volume, state.page.page);
  const edits = state.edits[k] = state.edits[k] || {};
  const cur = edits[strip.name] || { text: strip.text || "", checked: strip.checked, base: strip.text };
  edits[strip.name] = Object.assign(cur, change);
  // an edit that returns a strip to what is saved is no edit
  if (cur.text === (strip.text || "") && cur.checked === strip.checked) delete edits[strip.name];
  if (!Object.keys(edits).length) delete state.edits[k];
  updateStatus();
  drawQueue();
  if ("text" in change) schedulePreview();
}

function updateStatus() {
  const n = Object.keys(pageEdits() || {}).length;
  if (n) setStatus(`${n} strip(s) changed, unsaved`, "dirty");
  else setStatus(state.page.level >= 3 ? "Proofread (level 3)" : `Level ${state.page.level}`);
  $("save").disabled = $("revert").disabled = !n;
  const saves = state.page.saves || [];
  $("undo").disabled = !saves.length;
  $("undo").textContent = saves.length ? `Undo save (${saves.length})` : "Undo save";
  state.undoArmed = false;
}

// ── the rendered pane: the site's own viewer, on the page as it would enter ──
function schedulePreview() {
  clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(preview, 700);
}
// the server draws the page from the readings this tab holds: tell it what
// they are (the readings as saved, when the tab holds no edits, clear its draft)
async function syncDraft() {
  const pg = state.page, readings = {};
  for (const [name, s] of Object.entries(currentStrips())) readings[name] = s.text;
  await api("/desk/api/preview", { volume: pg.volume, page: pg.page, readings });
}
async function preview() {
  try {
    await syncDraft();
    refreshFrame();
  } catch (e) { setStatus(`Preview failed: ${e.message}`, "error"); }
}
// One scroll: the rendered pane keeps the same place, as a share of its
// length, as the original and the source beside it — scroll either, the
// other follows.  A scroll set here is not followed back (`state.led`).
function follow(from, to) {
  if (state.led === from) { state.led = null; return; }
  try {
    const span = w => w.document.documentElement.scrollHeight - w.innerHeight;
    const share = span(from) > 0 ? from.scrollY / span(from) : 0;
    const y = Math.round(share * Math.max(0, span(to)));
    if (Math.abs(to.scrollY - y) < 2) return;    // no move, so no echo to wait for
    state.led = to;
    to.scrollTo(0, y);
  } catch (e) {}
}
window.addEventListener("scroll", () => { if (state.frame) follow(window, state.frame.contentWindow); });

function refreshFrame() {
  const f = state.frame, pg = state.page;
  f.onload = () => {
    // the site's own chrome (its masthead, search, article arrows) is not the
    // page, nor is the article's header (its title and volume line): a page
    // enters an article that has its own
    const d = f.contentDocument, st = d.createElement("style");
    st.textContent = ".page > .card:first-child, .header-divider, .nav-arrow, "
      + "#app .card > h1, #app .card > h1 + div { display: none !important; } "
      // a page carrying on the paragraph of the page before opens unindented
      + ".body-text[data-runs-on] > :first-child { text-indent: 0 !important; }";
    d.head.appendChild(st);
    f.contentWindow.addEventListener("scroll", () => follow(f.contentWindow, window));
    // the viewer draws after its fetch: take the page's place once the body is there
    let tries = 0;
    const t = setInterval(() => {
      const d = f.contentDocument;
      if ((d && d.querySelector(".body-text")) || ++tries > 50) {
        clearInterval(t);
        state.led = null;
        follow(window, f.contentWindow);
      }
    }, 50);
  };
  f.src = `/article/desk?article=${encodeURIComponent(`/desk/article/${key(pg.volume, pg.page)}.json`)}&r=${++state.previewN}`;
}

// ── markup: the engine's constructs, wrapped round the selection ─────────
function drawPalette() {
  const pal = $("palette");
  pal.innerHTML = "";
  for (const c of state.page.constructs) {
    const b = document.createElement("button");
    b.textContent = c.name;
    b.title = c.says;
    b.addEventListener("mousedown", ev => ev.preventDefault());   // keep the selection
    b.addEventListener("click", () => wrap(c));
    pal.appendChild(b);
  }
}
function wrap(c) {
  const ta = state.lastFocus;
  if (!ta || !document.body.contains(ta)) { setStatus("Click in a source strip first", "error"); return; }
  const [a, z] = [ta.selectionStart, ta.selectionEnd];
  const sel = ta.value.slice(a, z);
  let inner = sel;
  if (c.args.length) {
    // the selection takes the first argument the sample fills; the others are left to fill
    let placed = false;
    inner = c.args.map(x => { if (x && !placed) { placed = true; return sel; } return ""; }).join("|");
  }
  // inserted as typing is, so Ctrl+Z takes it back
  ta.focus();
  ta.setSelectionRange(a, z);
  if (!document.execCommand("insertText", false, c.open + inner + c.close)) {
    ta.setRangeText(c.open + inner + c.close, a, z, "end");
    ta.dispatchEvent(new Event("input"));
  }
  if (!sel) ta.selectionStart = ta.selectionEnd = a + c.open.length;
}

// ── saving ─────────────────────────────────────────────────────────────
async function save() {
  const pg = state.page;
  if (!pageEdits()) return;
  setStatus("Saving…");
  try {
    const r = await api("/desk/api/save", { volume: pg.volume, page: pg.page, strips: currentStrips() });
    delete state.edits[key(pg.volume, pg.page)];
    state.page = r.page;
    await loadQueue();
    drawPage();
    setStatus(r.report, "saved");
  } catch (e) { setStatus(`Not saved: ${e.message}`, "error"); }
}

async function openPage(i) {
  const q = state.queue[i];
  if (!q) return;
  state.page = await api(`/desk/api/page/${q.volume}/${q.page}`);
  location.hash = key(q.volume, q.page);
  drawQueue();
  try { await syncDraft(); } catch (e) { setStatus(`Preview failed: ${e.message}`, "error"); }
  drawPage();
  window.scrollTo(0, 0);
}

// ── going back ─────────────────────────────────────────────────────────
async function revert() {
  delete state.edits[key(state.page.volume, state.page.page)];
  try { await syncDraft(); } catch (e) { setStatus(`Revert failed: ${e.message}`, "error"); return; }
  drawQueue();
  drawPage();
  setStatus("Reverted: the page as saved", "saved");
}
async function undoSave() {
  const pg = state.page, saves = pg.saves || [];
  if (!saves.length) return;
  if (pageEdits()) { setStatus("Save or revert your unsaved changes first", "error"); return; }
  if (!state.undoArmed) {
    // a second click, not a dialog: undo puts back what the last save replaced
    state.undoArmed = true;
    $("undo").textContent = "Click again to undo the last save";
    setTimeout(() => { if (state.undoArmed) updateStatus(); }, 5000);
    return;
  }
  setStatus("Undoing…");
  try {
    const r = await api("/desk/api/undo", { volume: pg.volume, page: pg.page });
    state.page = r.page;
    await loadQueue();
    drawPage();
    setStatus(r.report, "saved");
  } catch (e) { setStatus(`Not undone: ${e.message}`, "error"); }
}

function step(d) {
  const i = Number($("pages").value) + d;
  if (i >= 0 && i < state.queue.length) openPage(i);
}

$("pages").addEventListener("change", e => openPage(Number(e.target.value)));
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("save").addEventListener("click", save);
$("revert").addEventListener("click", revert);
$("undo").addEventListener("click", undoSave);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
window.addEventListener("hashchange", () => {
  const i = state.queue.findIndex(q => key(q.volume, q.page) === location.hash.slice(1));
  if (i >= 0 && !(state.page && key(state.page.volume, state.page.page) === location.hash.slice(1))) openPage(i);
});
window.addEventListener("beforeunload", e => { if (Object.keys(state.edits).length) e.preventDefault(); });
new ResizeObserver(() => document.documentElement.style.setProperty(
  "--hh", document.querySelector("header").offsetHeight + 12 + "px")).observe(document.querySelector("header"));

(async () => {
  try {
    await loadQueue();
    if (!state.queue.length) { $("main").innerHTML = `<div class="empty">Nothing waits to be proofread.</div>`; return; }
    const want = location.hash.slice(1);
    const i = Math.max(0, state.queue.findIndex(q => key(q.volume, q.page) === want));
    await openPage(i);
  } catch (e) { setStatus(`Could not load the desk: ${e.message}`, "error"); }
})();
</script>
</body>
</html>
