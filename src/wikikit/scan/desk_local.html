<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofreading Desk</title>
<style>
  :root {
    --paper: #faf6ee; --ink: #2b241c; --muted: #6b5e4f; --rule: #d8cdb8;
    --panel: #fffdf8; --accent: #7a3b12; --ok: #2f6b2f; --warn: #9a5b00; --bad: #a12a2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--rule); padding: 8px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, button, input { font: inherit; }
  select { max-width: 22em; padding: 3px 4px; }
  button { padding: 3px 10px; border: 1px solid var(--rule); background: #fff;
           border-radius: 4px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); margin-left: auto; }
  #status.dirty { color: var(--warn); }
  #status.error { color: var(--bad); }
  #status.saved { color: var(--ok); }
  .palette { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .palette button { padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .notes { margin: 6px 0 0; padding: 0; list-style: none; color: var(--warn); }
  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);
         gap: 12px; padding: 12px 16px; height: calc(100vh - var(--hh, 100px)); }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .tag { font-size: 12px; color: var(--muted); margin: 0 0 4px; display: flex; gap: 8px;
         align-items: center; text-transform: uppercase; letter-spacing: .05em; }
  .tag .zoom { margin-left: auto; display: flex; gap: 2px; text-transform: none; letter-spacing: 0; }
  .tag .zoom button { padding: 0 6px; font-size: 12px; }
  .tag .zoom button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .scan { flex: 1; overflow: auto; border: 1px solid var(--rule); background: #fff; border-radius: 4px; }
  .scan img { display: block; width: calc(100% * var(--zoom, 1)); max-width: none; }
  iframe { flex: 1; width: 100%; border: 1px solid var(--rule); background: #fff; border-radius: 4px; }
  .headrow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .headrow label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .headrow input { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px;
                   font: 13px Consolas, "DejaVu Sans Mono", monospace; }
  textarea { flex: 1; width: 100%; resize: none; padding: 6px;
             border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink);
             font: 13px/1.45 Consolas, "DejaVu Sans Mono", monospace; }
  textarea:focus, .headrow input:focus { outline: 2px solid #c9a46b; }
  .src.done textarea { background: #f4f9f1; }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .empty { padding: 40px 16px; color: var(--muted); }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0,1fr); height: auto; }
    .pane { height: 75vh; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Proofreading Desk</h1>
    <button id="prev" title="Previous page">◀</button>
    <select id="pages" aria-label="Page"></select>
    <button id="next" title="Next page">▶</button>
    <a id="ws" target="_blank" rel="noopener">Wikisource</a>
    <span id="status"></span>
    <button id="revert" title="Throw away this page's unsaved changes: back to the page as saved">Revert</button>
    <button id="undo" title="Put the page back as it was before its last save">Undo save</button>
    <button id="save" class="primary" title="Save (Ctrl+S)">Save</button>
  </div>
  <div class="palette" id="palette"></div>
  <ul class="notes" id="notes"></ul>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
"use strict";
/* A page is proofread whole: its scan, the page as it would enter (the site's
   own viewer, drawn by the server from the text as it stands here), and its
   running head and text, one text to correct and one check for the page. */
const $ = id => document.getElementById(id);
const state = { queue: [], page: null, edits: {}, previewTimer: 0, previewN: 0, led: null, zoom: 1 };
const key = (v, p) => `${v}-${p}`;

function setStatus(text, cls = "") { const s = $("status"); s.textContent = text; s.className = cls; }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ── the queue ──────────────────────────────────────────────────────────
function queueLabel(q) {
  const mark = q.level >= 3 ? "✓ proofread" : `level ${q.level}`;
  return `${q.label} — ${mark}${state.edits[key(q.volume, q.page)] ? " • unsaved" : ""}`;
}
function drawQueue() {
  const sel = $("pages");
  sel.innerHTML = "";
  state.queue.forEach((q, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = queueLabel(q);
    sel.appendChild(o);
  });
  if (state.page) sel.value = state.queue.findIndex(q => q.volume === state.page.volume && q.page === state.page.page);
}
async function loadQueue() {
  state.queue = await api("/desk/api/queue");
  drawQueue();
}

// ── one page ───────────────────────────────────────────────────────────
function pageEdits() { return state.edits[key(state.page.volume, state.page.page)]; }
// the page as the editor holds it; base: as it was loaded — the server
// refuses the save if the page on file is no longer that
function current() {
  const pg = state.page, e = pageEdits();
  return { head: e ? e.head : pg.head, text: e ? e.text : pg.text,
           checked: e ? e.checked : pg.checked, base: e ? e.base : [pg.head, pg.text] };
}

function drawPage() {
  const pg = state.page, main = $("main"), cur = current();
  main.innerHTML = "";
  $("ws").href = pg.wikisource || "#";
  $("ws").style.visibility = pg.wikisource ? "visible" : "hidden";
  const notes = $("notes"); notes.innerHTML = "";
  for (const n of pg.notes || []) { const li = document.createElement("li"); li.textContent = n; notes.appendChild(li); }

  const orig = document.createElement("section");
  orig.className = "pane";
  orig.innerHTML = `<div class="tag">Original<span class="zoom">${[1, 1.5, 2, 3].map(z =>
    `<button data-zoom="${z}" aria-pressed="${z === state.zoom}">${z === 1 ? "Fit" : z * 100 + "%"}</button>`).join("")}</span></div>
    <div class="scan"><img alt="The page's scan"></div>`;
  const box = orig.querySelector(".scan"), img = orig.querySelector("img");
  img.src = pg.scan;
  box.style.setProperty("--zoom", state.zoom);
  orig.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
    const old = state.zoom, z = Number(b.dataset.zoom);
    const fx = (box.scrollLeft + box.clientWidth / 2) / old, fy = (box.scrollTop + box.clientHeight / 2) / old;
    state.zoom = z; box.style.setProperty("--zoom", z);
    box.scrollLeft = fx * z - box.clientWidth / 2; box.scrollTop = fy * z - box.clientHeight / 2;
    orig.querySelectorAll("[data-zoom]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  const rendered = document.createElement("section");
  rendered.className = "pane";
  rendered.innerHTML = `<div class="tag">Rendered (as the page would enter)</div><iframe title="The page rendered as it would enter"></iframe>`;
  state.frame = rendered.querySelector("iframe");

  const src = document.createElement("section");
  src.className = "pane src";
  src.innerHTML = `<div class="tag">Source</div>
    <div class="headrow"><label for="head">Running head</label><input id="head" spellcheck="false"></div>
    <textarea id="text" spellcheck="false" aria-label="The page's text"></textarea>
    <label class="check"><input type="checkbox" id="checked"> The whole page checked against the original</label>`;
  main.append(orig, rendered, src);
  const head = $("head"), ta = $("text"), cb = $("checked");
  head.value = cur.head; ta.value = cur.text; cb.checked = cur.checked;
  src.classList.toggle("done", cur.checked);
  ta.addEventListener("scroll", () => follow(scroller(ta), frameScroller()));
  state.textBox = ta;
  for (const el of [head, ta]) {
    el.addEventListener("focus", () => { state.lastFocus = el; });
    el.addEventListener("input", () => edit({ head: head.value, text: ta.value }));
  }
  cb.addEventListener("change", () => { edit({ checked: cb.checked }); src.classList.toggle("done", cb.checked); });
  state.lastFocus = ta;
  refreshFrame();
  drawPalette();
  updateStatus();
}

function edit(change) {
  const pg = state.page, k = key(pg.volume, pg.page);
  const cur = state.edits[k] || { head: pg.head, text: pg.text, checked: pg.checked, base: [pg.head, pg.text] };
  state.edits[k] = Object.assign(cur, change);
  // an edit that returns the page to what is saved is no edit
  if (cur.head === pg.head && cur.text === pg.text && cur.checked === pg.checked) delete state.edits[k];
  updateStatus();
  drawQueue();
  if ("text" in change || "head" in change) schedulePreview();
}

function updateStatus() {
  const e = pageEdits(), pg = state.page;
  if (e) setStatus("Changed, unsaved", "dirty");
  else setStatus(pg.level >= 3 ? "Proofread (level 3)" : `Level ${pg.level}`);
  $("save").disabled = $("revert").disabled = !e;
  const saves = pg.saves || [];
  $("undo").disabled = !saves.length;
  $("undo").textContent = saves.length ? `Undo save (${saves.length})` : "Undo save";
  state.undoArmed = false;
}

// ── the rendered pane: the site's own viewer, on the page as it would enter ──
function schedulePreview() {
  clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(preview, 700);
}
// the server draws the page from the text this tab holds: tell it what it is
// (the page as saved, when the tab holds no edits, clears its draft)
async function syncDraft() {
  const pg = state.page, cur = current();
  await api("/desk/api/preview", { volume: pg.volume, page: pg.page, head: cur.head, text: cur.text });
}
async function preview() {
  try {
    await syncDraft();
    refreshFrame();
  } catch (e) { setStatus(`Preview failed: ${e.message}`, "error"); }
}

// One scroll: the source and the rendered page keep the same place, as a share
// of their length — scroll either, the other follows.  A scroll set here is
// not followed back (`state.led`).  The scan scrolls on its own: two columns,
// so no share of its length is the place the text has reached.
function scroller(el) {
  return { el, get y() { return el.scrollTop; }, set y(v) { el.scrollTop = v; },
           get span() { return el.scrollHeight - el.clientHeight; } };
}
function frameScroller() {
  const w = state.frame && state.frame.contentWindow;
  if (!w) return null;
  return { el: w, get y() { return w.scrollY; }, set y(v) { w.scrollTo(0, v); },
           get span() { return w.document.documentElement.scrollHeight - w.innerHeight; } };
}
function follow(from, to) {
  if (!from || !to) return;
  if (state.led === from.el) { state.led = null; return; }
  try {
    const share = from.span > 0 ? from.y / from.span : 0;
    const y = Math.round(share * Math.max(0, to.span));
    if (Math.abs(to.y - y) < 2) return;          // no move, so no echo to wait for
    state.led = to.el;
    to.y = y;
  } catch (e) {}
}

function refreshFrame() {
  const f = state.frame, pg = state.page;
  f.onload = () => {
    // the site's own chrome (its masthead, search, article arrows) is not the
    // page, nor is the article's header (its title and volume line): a page
    // enters an article that has its own
    const d = f.contentDocument, st = d.createElement("style");
    st.textContent = ".page > .card:first-child, .header-divider, .nav-arrow, "
      + "#app .card > h1, #app .card > h1 + div { display: none !important; } "
      // a page carrying on the paragraph of the page before opens unindented:
      // its opening text is bare, or a block (small type) — never a <p>, which
      // is a new paragraph even when no tag stands before it (vol 26 p. 588's
      // "Insanity.—")
      + ".body-text[data-runs-on] > :first-child:not(p) { text-indent: 0 !important; } "
      // ...and its first <p> is a new paragraph, indented as in its article —
      // not the article's opening one the site sets flush (vol 25 p. 1017's
      // "I. Iron bar in direct tension:—")
      + ".body-text[data-runs-on] > p:first-of-type { text-indent: 1.5em; }";
    d.head.appendChild(st);
    f.contentWindow.addEventListener("scroll", () => follow(frameScroller(), scroller(state.textBox)));
    // the viewer draws after its fetch: take the source's place once the body is there
    let tries = 0;
    const t = setInterval(() => {
      const d = f.contentDocument;
      if ((d && d.querySelector(".body-text")) || ++tries > 50) {
        clearInterval(t);
        state.led = null;
        follow(scroller(state.textBox), frameScroller());
      }
    }, 50);
  };
  f.src = `/article/desk?article=${encodeURIComponent(`/desk/article/${key(pg.volume, pg.page)}.json`)}&r=${++state.previewN}`;
}

// ── markup: the engine's constructs, wrapped round the selection ─────────
function drawPalette() {
  const pal = $("palette");
  pal.innerHTML = "";
  for (const c of state.page.constructs) {
    const b = document.createElement("button");
    b.textContent = c.name;
    b.title = c.says;
    b.addEventListener("mousedown", ev => ev.preventDefault());   // keep the selection
    b.addEventListener("click", () => wrap(c));
    pal.appendChild(b);
  }
}
function wrap(c) {
  const ta = state.lastFocus;
  if (!ta || !document.body.contains(ta)) { setStatus("Click in the source first", "error"); return; }
  const [a, z] = [ta.selectionStart, ta.selectionEnd];
  const sel = ta.value.slice(a, z);
  let inner = sel;
  if (c.args.length) {
    // the selection takes the first argument the sample fills; the others are left to fill
    let placed = false;
    inner = c.args.map(x => { if (x && !placed) { placed = true; return sel; } return ""; }).join("|");
  }
  // inserted as typing is, so Ctrl+Z takes it back
  ta.focus();
  ta.setSelectionRange(a, z);
  if (!document.execCommand("insertText", false, c.open + inner + c.close)) {
    ta.setRangeText(c.open + inner + c.close, a, z, "end");
    ta.dispatchEvent(new Event("input"));
  }
  if (!sel) ta.selectionStart = ta.selectionEnd = a + c.open.length;
}

// ── saving ─────────────────────────────────────────────────────────────
async function save() {
  const pg = state.page;
  if (!pageEdits()) return;
  const cur = current();
  setStatus("Saving…");
  try {
    const r = await api("/desk/api/save", { volume: pg.volume, page: pg.page, head: cur.head, text: cur.text,
                                            base: cur.base, status: cur.checked ? "checked" : "unchecked" });
    delete state.edits[key(pg.volume, pg.page)];
    state.page = r.page;
    await loadQueue();
    drawPage();
    setStatus(r.report, "saved");
  } catch (e) { setStatus(`Not saved: ${e.message}`, "error"); }
}

async function openPage(i) {
  const q = state.queue[i];
  if (!q) return;
  state.page = await api(`/desk/api/page/${q.volume}/${q.page}`);
  location.hash = key(q.volume, q.page);
  drawQueue();
  try { await syncDraft(); } catch (e) { setStatus(`Preview failed: ${e.message}`, "error"); }
  drawPage();
}

// ── going back ─────────────────────────────────────────────────────────
async function revert() {
  delete state.edits[key(state.page.volume, state.page.page)];
  try { await syncDraft(); } catch (e) { setStatus(`Revert failed: ${e.message}`, "error"); return; }
  drawQueue();
  drawPage();
  setStatus("Reverted: the page as saved", "saved");
}
async function undoSave() {
  const pg = state.page, saves = pg.saves || [];
  if (!saves.length) return;
  if (pageEdits()) { setStatus("Save or revert your unsaved changes first", "error"); return; }
  if (!state.undoArmed) {
    // a second click, not a dialog: undo puts back what the last save replaced
    state.undoArmed = true;
    $("undo").textContent = "Click again to undo the last save";
    setTimeout(() => { if (state.undoArmed) updateStatus(); }, 5000);
    return;
  }
  setStatus("Undoing…");
  try {
    const r = await api("/desk/api/undo", { volume: pg.volume, page: pg.page });
    state.page = r.page;
    await loadQueue();
    drawPage();
    setStatus(r.report, "saved");
  } catch (e) { setStatus(`Not undone: ${e.message}`, "error"); }
}

function step(d) {
  const i = Number($("pages").value) + d;
  if (i >= 0 && i < state.queue.length) openPage(i);
}

$("pages").addEventListener("change", e => openPage(Number(e.target.value)));
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("save").addEventListener("click", save);
$("revert").addEventListener("click", revert);
$("undo").addEventListener("click", undoSave);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
window.addEventListener("hashchange", () => {
  const i = state.queue.findIndex(q => key(q.volume, q.page) === location.hash.slice(1));
  if (i >= 0 && !(state.page && key(state.page.volume, state.page.page) === location.hash.slice(1))) openPage(i);
});
window.addEventListener("beforeunload", e => { if (Object.keys(state.edits).length) e.preventDefault(); });
new ResizeObserver(() => document.documentElement.style.setProperty(
  "--hh", document.querySelector("header").offsetHeight + "px")).observe(document.querySelector("header"));

(async () => {
  try {
    await loadQueue();
    if (!state.queue.length) { $("main").innerHTML = `<div class="empty">Nothing waits to be proofread.</div>`; return; }
    const want = location.hash.slice(1);
    const i = Math.max(0, state.queue.findIndex(q => key(q.volume, q.page) === want));
    await openPage(i);
  } catch (e) { setStatus(`Could not load the desk: ${e.message}`, "error"); }
})();
</script>
</body>
</html>
