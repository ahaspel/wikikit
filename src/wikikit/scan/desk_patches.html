<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch Desk</title>
<!-- the site's KaTeX: an edit's formulas must render as the site renders them -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
<style>
  :root {
    --paper: #faf6ee; --ink: #2b241c; --muted: #6b5e4f; --rule: #d8cdb8;
    --panel: #fffdf8; --accent: #7a3b12; --ok: #2f6b2f; --warn: #9a5b00; --bad: #a12a2a;
    --old: #f6d5d0; --new: #d3ecd0; --spot: rgba(214, 120, 30, .28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--rule); padding: 8px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, button, input { font: inherit; }
  select { max-width: 30em; padding: 3px 4px; }
  button { padding: 3px 10px; border: 1px solid var(--rule); background: #fff;
           border-radius: 4px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  label.opt { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  #status { color: var(--muted); margin-left: auto; }
  #status.error { color: var(--bad); }
  #status.saved { color: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
         gap: 12px; padding: 12px 16px; height: calc(100vh - var(--hh, 60px)); }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .tag { font-size: 12px; color: var(--muted); margin: 0 0 4px; display: flex; gap: 8px;
         align-items: center; text-transform: uppercase; letter-spacing: .05em; }
  .tag .zoom { margin-left: auto; display: flex; gap: 2px; text-transform: none; letter-spacing: 0; }
  .tag .zoom button { padding: 0 6px; font-size: 12px; }
  .tag .zoom button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .scan { flex: 1; overflow: auto; border: 1px solid var(--rule); background: #fff; border-radius: 4px; }
  .sheet { position: relative; width: calc(100% * var(--zoom, 2)); }
  .sheet img { display: block; width: 100%; }
  .spot { position: absolute; background: var(--spot); border: 2px solid #d6781e; border-radius: 3px;
          pointer-events: none; }
  .spot.estimated { border-style: dashed; }
  .list { flex: 1; overflow: auto; padding-right: 4px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
          padding: 8px 10px; margin-bottom: 10px; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(122, 59, 18, .15); }
  .card.keep { border-left: 5px solid var(--ok); }
  .card.drop { border-left: 5px solid var(--bad); }
  .card.edit { border-left: 5px solid var(--accent); }
  /* a ruled patch: one line, out of the way; click it to open it again */
  .card.done { padding: 3px 10px; margin-bottom: 4px; cursor: pointer; opacity: .75; }
  .card.done:hover { opacity: 1; }
  .card.done .sum { font: 12px Consolas, "DejaVu Sans Mono", monospace; color: var(--muted);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .card.done .meta { flex-wrap: nowrap; }
  .meta .n { font-weight: 600; color: var(--ink); }
  .pill { padding: 0 6px; border-radius: 9px; border: 1px solid var(--rule); background: #fff; white-space: nowrap; }
  .pill.flag { color: var(--bad); border-color: #e3b5ad; background: #fdf1ef; }
  .pill.chain-drop { color: var(--warn); }
  .pill.ruled { color: #fff; background: var(--ok); border-color: var(--ok); }
  .pill.ruled.drop { background: var(--bad); border-color: var(--bad); }
  .pill.ruled.edit { background: var(--accent); border-color: var(--accent); }
  .was { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-word; }
  .was code { font: 12px Consolas, "DejaVu Sans Mono", monospace; }
  .flags { margin: 4px 0 0; padding-left: 18px; color: var(--bad); font-size: 12px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
  .cols h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; color: var(--muted);
             text-transform: uppercase; letter-spacing: .05em; }
  pre { position: relative; margin: 0; padding: 6px; background: #fff; border: 1px solid var(--rule); border-radius: 4px;
        white-space: pre-wrap; word-break: break-word; max-height: 16em; overflow: auto;
        font: 12.5px/1.45 Consolas, "DejaVu Sans Mono", monospace; }
  pre.edit { cursor: text; }
  pre.edit:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .card.dirty pre.edit { border-color: var(--warn); background: #fffaf0; }
  .card.refused pre.edit { border-color: var(--bad); background: #fdf1ef; }
  pre .ctx { color: #8a7d6c; }
  mark.old { background: var(--old); color: var(--ink); outline: 1px solid #d9a197; }
  mark.new { background: var(--new); color: var(--ink); outline: 1px solid #93c38c; }
  mark:empty::before { content: "∅"; color: var(--muted); }
  .act { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .act input { flex: 1; min-width: 10em; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 4px; }
  .act .keep { border-color: var(--ok); color: var(--ok); }
  .act .drop { border-color: var(--bad); color: var(--bad); }
  .warn { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .empty { padding: 40px 16px; color: var(--muted); }
  .alldone { padding: 10px; margin-bottom: 10px; border: 1px dashed var(--ok); border-radius: 6px; color: var(--ok); }
  .keys { font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); height: auto; }
    .pane { height: 70vh; }
    .cols { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Patch Desk</h1>
    <button id="prev" title="Previous page">◀</button>
    <select id="pages" aria-label="Page"></select>
    <button id="next" title="Next page">▶</button>
    <label class="opt"><input type="checkbox" id="flagged"> flagged pages only</label>
    <label class="opt"><input type="checkbox" id="unfinished" checked> hide finished pages</label>
    <a id="desk" href="../desk">the proofreading desk</a>
    <span class="keys">type in the green box to change it · ↑/↓ patch · K keep · D drop · E edit · C clear</span>
    <span id="status"></span>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
"use strict";
/* Each patch on a fetched page, beside the scan: Wikisource's markup as it
   stands and as the patch would leave it.  A person's ruling, keep, drop or
   edit (their own text typed into the "with" box, over the patch's span or
   wider), is final over every check (the book's install honours it).  A
   ruled patch folds to one line and is skipped; the scan follows the caret. */
const $ = id => document.getElementById(id);
const state = { queue: [], page: null, on: 0, zoom: 2, open: new Set() };
const base = location.pathname.replace(/\/desk\/patches\/?$/, "");

function remember(k, v) { try { localStorage.setItem("patchdesk." + k, JSON.stringify(v)); } catch (e) {} }
function recall(k, d) { try { const v = localStorage.getItem("patchdesk." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }

function setStatus(text, cls = "") { const s = $("status"); s.textContent = text; s.className = cls; }

async function api(path, body) {
  const r = await fetch(base + path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

/* ---- pages ---- */

const finished = q => q.patches > 0 && q.ruled >= q.patches;

function shown() {
  return state.queue.filter(q => (!$("flagged").checked || q.flagged) && (!$("unfinished").checked || !finished(q)
    || (state.page && q.volume === state.page.volume && q.page === state.page.page)));
}

function drawQueue() {
  const sel = $("pages"), cur = state.page && `${state.page.volume}-${state.page.page}`;
  sel.textContent = "";
  for (const q of shown()) {
    const o = document.createElement("option");
    o.value = `${q.volume}-${q.page}`;
    o.textContent = (finished(q) ? "✓ " : "") + `${q.label} — ${q.patches} patch${q.patches === 1 ? "" : "es"}`
      + (q.flagged ? `, ${q.flagged} flagged` : "") + (q.ruled ? `, ${q.ruled} ruled` : "");
    sel.append(o);
  }
  if (cur) sel.value = cur;
}

async function loadQueue() {
  state.queue = await api("/desk/api/patch-queue");
  drawQueue();
}

const unruled = () => state.page.patches.map((x, i) => i).filter(i => !state.page.patches[i].ruling);

async function openPage(v, p) {
  setStatus("loading…");
  state.page = await api(`/desk/api/patches/${v}/${p}`);
  state.open = new Set();
  const left = unruled();
  state.on = left.length ? left[0] : 0;
  drawQueue();
  $("pages").value = `${v}-${p}`;
  draw();
  setStatus("");
}

/* ---- the page's patches ---- */

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function markup(before, mid, after, cls) {
  const pre = el("pre");
  pre.append(el("span", "ctx", before), el("mark", cls, mid), el("span", "ctx", after));
  return pre;
}

function draw() {
  const pg = state.page, main = $("main");
  main.textContent = "";
  const left = el("section", "pane"), right = el("section", "pane");
  const tag = el("div", "tag"); tag.append("Original");
  const zoom = el("span", "zoom");
  for (const z of [1, 1.5, 2, 3]) {
    const b = el("button", "", `${z}×`);
    b.setAttribute("aria-pressed", String(z === state.zoom));
    b.onclick = () => { state.zoom = z; draw(); };
    zoom.append(b);
  }
  tag.append(zoom);
  const scan = el("div", "scan"), sheet = el("div", "sheet");
  sheet.style.setProperty("--zoom", state.zoom);
  const img = el("img"); img.src = base + pg.scan; img.alt = `scan of ${pg.label}`;
  const spot = el("div", "spot"); spot.hidden = true;
  sheet.append(img, spot); scan.append(sheet);
  left.append(tag, scan);
  img.onload = () => focusSpot(true);

  const rtag = el("div", "tag"), list = el("div", "list");
  right.append(rtag, list);
  main.append(left, right);
  state.els = { scan, img, spot, list, rtag };
  pg.patches.forEach((x, i) => list.append(card(x, i)));
  if (!pg.patches.length) list.append(el("div", "empty", "No patches on this page."));
  tally();
  centreMarks(list);
  highlight(true);
}

function tally() {
  /* the page's count, and the note that it is finished */
  const pg = state.page, left = unruled().length, { rtag, list } = state.els;
  rtag.textContent = `${pg.label}: ${pg.patches.length} patch${pg.patches.length === 1 ? "" : "es"}`
    + (left ? `, ${left} to rule` : ", all ruled");
  const note = list.querySelector(".alldone");
  if (!left && pg.patches.length && !note) {
    const d = el("div", "alldone", "Every patch on this page is ruled. ▶ for the next page.");
    list.prepend(d);
  } else if (left && note) note.remove();
}

function centreMarks(root) {
  // each markup box opens on its change, not on the context before it
  for (const pre of root.querySelectorAll("pre")) {
    const m = pre.querySelector("mark");
    if (m) pre.scrollTop = m.offsetTop - (pre.clientHeight - m.offsetHeight) / 2;
  }
}

function card(x, i) {
  const r = x.ruling, c = el("article", "card" + (r ? " " + r.ruling : ""));
  c.dataset.i = i;
  c.shows = x;                                        // an edit is read against the patch as this card shows it
  if (r && !state.open.has(i)) {
    // ruled: one line; click to open it again
    c.classList.add("done");
    const meta = el("div", "meta");
    meta.append(el("span", "n", `#${i + 1}`),
                el("span", "pill ruled " + r.ruling, (r.ruling === "edit" ? "edited" : r.ruling)),
                el("span", "sum", `${x.was || "∅"} → ${r.ruling === "drop" ? "(dropped)" : x.now || "∅"}`));
    c.append(meta);
    c.onclick = () => { state.open.add(i); state.on = i; replaceCard(i); highlight(true); };
    return c;
  }
  c.onclick = e => {
    if (e.target.closest("pre, button, input")) return;
    state.on = i; highlight(false); focusSpot(true);
  };
  const meta = el("div", "meta");
  meta.append(el("span", "n", `#${i + 1}`), el("span", "pill", x.kind));
  meta.append(el("span", "pill" + (x.chain === "drop" ? " chain-drop" : ""),
                 x.chain === "drop" ? "checks: dropped" : "checks: installed"));
  if (x.flags.length) meta.append(el("span", "pill flag", `${x.flags.length} flag${x.flags.length === 1 ? "" : "s"}`));
  if (r) meta.append(el("span", "pill ruled " + r.ruling,
                        (r.ruling === "edit" ? "edited" : `ruled ${r.ruling}`) + (r.by ? ` by ${r.by}` : "")));
  if (!x.place) meta.append(el("span", "", "· not placed on the scan"));
  else if (x.place.estimated) meta.append(el("span", "", "· place on the scan estimated"));
  c.append(meta);
  if (x.flags.length) {
    const ul = el("ul", "flags");
    for (const f of x.flags) ul.append(el("li", "", f));
    c.append(ul);
  }
  if (!x.stands) c.append(el("div", "warn", "Wikisource's page has changed: the old text no longer stands at this place."));
  const cols = el("div", "cols"), a = el("div"), b = el("div");
  const now = markup(x.before, x.was, x.after, "old");
  const edit = markup(x.before, x.now, x.after, "new");
  edit.classList.add("edit");
  edit.spellcheck = false;
  edit.contentEditable = "plaintext-only";
  if (edit.contentEditable !== "plaintext-only") edit.contentEditable = "true";
  a.append(el("h3", "", "Wikisource now"), now);
  b.append(el("h3", "", r && r.ruling === "edit" ? "With your edit — type to change" : "With the patch — type to change"), edit);
  cols.append(a, b);
  c.append(cols);
  if (r && r.ruling === "edit") {
    const was = el("div", "was", "The reading's patch was: ");
    was.append(el("code", "", `${x.old || "∅"} → ${x.new || "∅"}`));
    c.append(was);
  }
  for (const pre of [now, edit]) {
    pre.addEventListener("focus", () => { state.on = i; highlight(false); });
    pre.addEventListener("click", () => { state.on = i; highlight(false); followCaret(); });
  }
  edit.addEventListener("input", () => { c.classList.add("dirty"); c.classList.remove("refused");
                                         setStatus("editing — click away or Ctrl+Enter saves, Esc puts it back"); });
  edit.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); revert(i); }
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(i); }
  });
  const act = el("div", "act");
  const note = el("input"); note.placeholder = "note (why)"; note.value = r ? r.note || "" : "";
  const keep = el("button", "keep", "Keep"), drop = el("button", "drop", "Drop"),
        clear = el("button", "", "Clear");
  for (const btn of [keep, drop, clear]) btn.onmousedown = e => e.preventDefault();   // the box keeps its caret
  keep.onclick = () => c.classList.contains("dirty") ? commit(i) : rule(i, "keep", note.value);
  drop.onclick = () => rule(i, "drop", note.value);
  clear.onclick = () => c.classList.contains("dirty") ? revert(i) : rule(i, null, "");
  clear.disabled = !r;
  act.append(keep, drop, clear, note);
  c.append(act);
  // leaving the card saves what was typed in it (an edit, or a ruled patch's note)
  c.addEventListener("focusout", e => {
    if (e.relatedTarget && c.contains(e.relatedTarget)) return;
    if (!c.isConnected || c.saving) return;          // redrawn after a save: nothing new typed in it
    if (c.classList.contains("dirty")) commit(i);
    else if (r && note.value !== (r.note || "")) rule(i, r.ruling, note.value, r.edit && {
      start: r.edit.start, end: r.edit.end, text: r.edit.new, was: r.edit.old }, false);
  });
  return c;
}

function cardEl(i) { return state.els.list.querySelector(`.card[data-i="${i}"]`); }

function replaceCard(i) {
  const old = cardEl(i), c = card(state.page.patches[i], i);
  old.replaceWith(c);
  centreMarks(c);
  return c;
}

function revert(i) {
  const c = cardEl(i);
  c.classList.remove("dirty", "refused");
  replaceCard(i);
  highlight(false);
  setStatus("put back");
}

/* ---- an edit: what changed in the box, as a span of Wikisource's page ---- */

function katexProblem(text) {
  /* the first formula in `text` KaTeX refuses, as the site hands it (\mbox
     read as \text); null when every one renders */
  const tex = [...text.matchAll(/<math[^>]*>([\s\S]*?)<\/math>/gi)].map(m => m[1]);
  if (!tex.length) return null;
  if (typeof katex === "undefined") return "KaTeX did not load, so the formulas can't be checked — nothing saved";
  for (const t of tex) {
    try { katex.renderToString(t.replace(/\\mbox\b/g, "\\text"), { throwOnError: true }); }
    catch (e) { return `KaTeX refuses ${JSON.stringify(t.slice(0, 60))}: ${e.message}`; }
  }
  return null;
}

function editOf(x, typed) {
  /* the box held before + now + after; `typed` is what it holds now.  The
     changed stretch, joined with the patch's own, is the span replaced. */
  const B = x.before + x.now + x.after, T = typed;
  let p = 0;
  while (p < B.length && p < T.length && B[p] === T[p]) p++;
  let s = 0;
  while (s < B.length - p && s < T.length - p && B[B.length - 1 - s] === T[T.length - 1 - s]) s++;
  const lo = Math.min(p, x.before.length), hi = Math.max(B.length - s, x.before.length + x.now.length);
  // `was`: what the box showed over the span, for the desk to hold the page to
  // (on a patch already edited, the span's own text is the person's last edit)
  const shownOld = x.before.slice(lo) + x.was + x.after.slice(0, Math.max(0, hi - x.before.length - x.now.length));
  return { start: x.span[0] - (x.before.length - lo), end: x.span[1] + (hi - x.before.length - x.now.length),
           text: T.slice(lo, T.length - (B.length - hi)), was: shownOld };
}

async function commit(i) {
  const c = cardEl(i);
  if (!c || c.saving || !c.classList.contains("dirty")) return;
  const x = c.shows, typed = c.querySelector("pre.edit").textContent;
  if (typed === x.before + x.now + x.after) { c.classList.remove("dirty"); return; }
  const e = editOf(x, typed), note = c.querySelector(".act input").value;
  if (e.start === x.start && e.end === x.end && e.text === x.new) return rule(i, "keep", note);
  const bad = katexProblem(e.text);
  if (bad) { c.classList.add("refused"); setStatus(bad, "error"); return; }
  return rule(i, "edit", note, e);
}

function noteOf(i) { const c = cardEl(i), n = c && c.querySelector(".act input"); return n ? n.value : ""; }

async function rule(i, ruling, note, edit, advance = true) {
  const pg = state.page, x = pg.patches[i], mine = cardEl(i);
  if (mine) { mine.saving = true; mine.classList.remove("dirty"); }   // what it held is being saved
  try {
    setStatus("saving…");
    const r = await api("/desk/api/patch-ruling", { volume: pg.volume, page: pg.page,
                                                    old: x.old, new: x.new, ruling, note, edit });
    const q0 = state.queue.find(q => q.volume === pg.volume && q.page === pg.page);
    if (state.page !== pg) {                          // the person has moved to another page meanwhile
      if (q0) { q0.ruled = r.page.patches.filter(p => p.ruling).length; drawQueue(); }
      setStatus(r.report, "saved");
      return;
    }
    state.page.patches[i] = r.page.patches[i];
    state.open.delete(i);
    const c = replaceCard(i);
    c.classList.remove("dirty", "refused");
    setStatus(r.report, "saved");
    const q = state.queue.find(q => q.volume === state.page.volume && q.page === state.page.page);
    if (q) { q.ruled = state.page.patches.filter(p => p.ruling).length; drawQueue(); }
    tally();
    // on to the next patch to rule, unless the person has gone to another box
    const away = document.activeElement && document.activeElement.closest && document.activeElement.closest(".card");
    if (advance && ruling && !away) {
      const left = unruled(), next = left.find(k => k > i) ?? left[0];
      if (next !== undefined) state.on = next;
    }
    highlight(!away);
  } catch (e) {
    const c = state.page === pg && cardEl(i);
    if (c) {
      c.saving = false;
      c.classList.add("refused");
      if (edit) c.classList.add("dirty");             // what was typed stands, unsaved: fix it or Esc
    }
    setStatus(e.message, "error");
  }
}

/* ---- the scan follows ---- */

function highlight(scrollList) {
  for (const c of state.els.list.querySelectorAll(".card")) c.classList.toggle("on", Number(c.dataset.i) === state.on);
  const c = cardEl(state.on);
  if (c && scrollList) c.scrollIntoView({ block: "nearest" });
  focusSpot(scrollList);
}

function focusSpot(force, shift = 0) {
  /* the spot where patch `state.on` stands, `shift` characters on from its
     start; the scan scrolls to it when it is out of the middle of view */
  const { img, spot, scan } = state.els, x = state.page.patches[state.on];
  if (!x || !x.place || !img.naturalWidth) { spot.hidden = true; return; }
  const [x0, y0, x1, y1] = x.place.box, W = img.naturalWidth, H = img.naturalHeight;
  const at = Math.min(1, Math.max(0, x.place.at + shift / Math.max(1, x.place.len || 1)));
  const y = y0 + at * (y1 - y0), band = Math.max(90, (y1 - y0) * 0.04);
  spot.hidden = false;
  spot.classList.toggle("estimated", !!x.place.estimated);
  spot.style.left = `${100 * x0 / W}%`;
  spot.style.width = `${100 * (x1 - x0) / W}%`;
  spot.style.top = `${100 * Math.max(y0, y - band / 3) / H}%`;
  spot.style.height = `${100 * band / H}%`;
  const k = img.clientWidth / W, top = y * k - scan.clientHeight / 2;
  const off = Math.abs(scan.scrollTop - top) > scan.clientHeight * 0.25 || Math.abs(scan.scrollLeft - (x0 * k - 12)) > scan.clientWidth * 0.5;
  if (force || off) scan.scrollTo({ top, left: x0 * k - 12, behavior: "smooth" });
}

let caretFrame = 0;
function followCaret() {
  /* the caret's place in a markup box, as characters from the patch's start */
  cancelAnimationFrame(caretFrame);
  caretFrame = requestAnimationFrame(() => {
    const sel = document.getSelection();
    if (!sel || !sel.rangeCount || !state.els) return;
    const node = sel.focusNode, pre = node && (node.nodeType === 1 ? node : node.parentElement)?.closest("pre");
    if (!pre || !state.els.list.contains(pre)) return;
    const c = pre.closest(".card"), i = Number(c.dataset.i), x = state.page.patches[i];
    const r = document.createRange();
    r.setStart(pre, 0);
    r.setEnd(sel.focusNode, sel.focusOffset);
    const k = r.toString().length;
    if (state.on !== i) { state.on = i; highlight(false); }
    focusSpot(false, k - x.before.length);
  });
}
document.addEventListener("selectionchange", followCaret);

function step(d) {
  const qs = shown(), at = qs.findIndex(q => q.volume === state.page?.volume && q.page === state.page?.page);
  const q = qs[Math.max(0, Math.min(qs.length - 1, at + d))];
  if (q) openPage(q.volume, q.page).catch(e => setStatus(e.message, "error"));
}

function move(d) {
  /* to the next patch to rule; on a finished page, to the next patch */
  const left = unruled(), n = state.page.patches.length;
  if (left.length) {
    const next = d > 0 ? left.find(k => k > state.on) : [...left].reverse().find(k => k < state.on);
    if (next !== undefined) state.on = next;
  } else state.on = Math.max(0, Math.min(n - 1, state.on + d));
  highlight(true);
}

$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("pages").onchange = e => { const [v, p] = e.target.value.split("-").map(Number); openPage(v, p); };
for (const id of ["flagged", "unfinished"]) {
  $(id).checked = recall(id, $(id).checked);
  $(id).onchange = () => { remember(id, $(id).checked); drawQueue(); };
}
document.addEventListener("keydown", e => {
  const t = e.target;
  if (!state.page || t.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(t.tagName)
      || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); move(e.key === "ArrowDown" ? 1 : -1); }
  else if (k === "k") rule(state.on, "keep", noteOf(state.on));
  else if (k === "d") rule(state.on, "drop", noteOf(state.on));
  else if (k === "c") rule(state.on, null, "");
  else if (k === "e") {
    e.preventDefault();                               // the "e" is not typed into the box
    let c = cardEl(state.on);
    if (c.classList.contains("done")) { state.open.add(state.on); c = replaceCard(state.on); highlight(false); }
    const pre = c.querySelector("pre.edit"), m = pre.querySelector("mark");
    pre.focus();
    const r = document.createRange(); r.selectNodeContents(m); r.collapse(false);
    const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
});
new ResizeObserver(() => document.documentElement.style.setProperty(
  "--hh", document.querySelector("header").offsetHeight + "px")).observe(document.querySelector("header"));

(async () => {
  try {
    await loadQueue();
    const qs = shown(), first = qs.find(q => q.flagged) || qs[0];
    if (first) await openPage(first.volume, first.page);
    else $("main").innerHTML = '<div class="empty">No patches left to rule.</div>';
  } catch (e) { setStatus(e.message, "error"); }
})();
</script>
</body>
</html>
