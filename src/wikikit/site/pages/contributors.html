<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@@work_name@@, @@edition_label@@ &mdash; Contributors</title>
  <style>
    :root {
      --bg: #f5f1eb;
      --panel: #fdfcf9;
      --text: #2c2416;
      --muted: #6b5e4f;
      --border: #d4cab8;
      --link: #7b3f00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Cambria Math", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      font-variant: small-caps;
      letter-spacing: 0.06em;
      color: #2c2416;
    }

    h2 { margin-top: 0; font-size: 1.3rem; }

    .stats {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
      font-size: 1rem;
      margin-bottom: 16px;
      background: var(--panel);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--link);
      box-shadow: 0 0 0 3px rgba(123, 63, 0, 0.12);
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .contributor {
      margin-bottom: 24px;
      scroll-margin-top: 16px;
    }

    /* The entry an article byline linked to.  A rule and a tint rather than a
       jump alone: the reader arrives mid-list and needs to see WHICH of the
       1,508 entries answered the link. */
    .contributor.targeted {
      border-left: 3px solid var(--link);
      padding-left: 12px;
      margin-left: -15px;
      background: var(--panel);
      border-radius: 0 4px 4px 0;
    }

    .contributor-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .contributor-initials {
      color: var(--muted);
      font-size: 0.9rem;
      margin-left: 2px;
      margin-right: 4px;
    }

    .article-count {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .contributor-desc {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 3px;
    }

    .article-list {
      margin: 6px 0 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
    }

    .article-list li {
      font-size: 0.92rem;
    }

    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .nav-arrow {
      position: fixed;
      right: 8px;
      top: 50%;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      z-index: 50;
      color: #8b7355;
      padding: 4px;
      line-height: 1;
    }
    .nav-arrow:hover { color: #5c4a32; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/article-urls.js"></script>
</head>
<body>
  <div class="page">
    <div class="card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <h1 style="margin: 0; font-size: 1.3rem; color: #5c4a32;"><a href="/home.html" style="color: inherit; text-decoration: none;"><svg viewBox="0 0 32 32" width="32" height="32" style="vertical-align: middle; margin-right: 10px;" aria-hidden="true"><rect x="1" y="1" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1"/><rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="currentColor" stroke-width="0.6"/><text x="16" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="currentColor" style="letter-spacing:-0.3px">@@monogram@@</text></svg><span style="font-variant: small-caps; letter-spacing: 0.06em;">Contributors</span> <span style="font-variant: normal; font-style: italic; letter-spacing: 0.02em;">&mdash; @@edition_label@@</span></a></h1>
        <div style="font-size: 0.9rem;">
          <a href="/index.html" style="color: var(--link); text-decoration: none;">Articles</a>
          &nbsp;&middot;&nbsp;
          <a href="/topics.html" style="color: var(--link); text-decoration: none;">Topics</a>
          &nbsp;&middot;&nbsp;
          <a href="/ancillary.html" style="color: var(--link); text-decoration: none;">Ancillary</a>
          &nbsp;&middot;&nbsp;
          <a href="/download.html" style="color: var(--link); text-decoration: none;">Download</a>
        </div>
      </div>
      <div id="stats" class="stats">Loading...</div>
      <input id="search" class="search-box" type="text" placeholder="Search contributors..." />
    </div>
    <div style="text-align:center; color:#8b7355; font-size:1.6rem; margin:-6px 0 14px; letter-spacing:0.3em; user-select:none;">&#x223C;&#x25C6;&#x223C;</div>
    <div class="card">
      <div id="contributor-list"></div>
      <div id="empty" class="empty" style="display:none">No matching contributors.</div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const listEl = document.getElementById("contributor-list");
    const emptyMsg = document.getElementById("empty");
    const statsEl = document.getElementById("stats");

    let contributorData = [];

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function viewerUrl(filename) {
      return BritannicaUrls.filenameToUrl(filename);
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = contributorData.filter(c =>
        !query ||
        c.full_name.toLowerCase().includes(query) ||
        (c.display_name || "").toLowerCase().includes(query) ||
        c.initials.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyMsg.style.display = "block";
        return;
      }

      emptyMsg.style.display = "none";

      listEl.innerHTML = filtered.map(c => {
        const articleLinks = c.articles
          .sort((a, b) => a.title.localeCompare(b.title))
          .map(a => `<li><a href="${viewerUrl(a.filename)}">${escapeHtml(a.title)}</a></li>`)
          .join("");

        const creds = c.credentials ? `, ${c.credentials}` : "";
        let desc = "";
        if (c.description) {
          let descText = c.description.replace(/See the biographical article[,:.]?\s*.*/i, "").trim();
          if (c.bio_article_filename) {
            const bioLink = `<a href="${viewerUrl(c.bio_article_filename)}" style="color: var(--link);">(See biographical article.)</a>`;
            desc = `<div class="contributor-desc">${descText ? escapeHtml(descText) + " " : ""}${bioLink}</div>`;
          } else if (c.description) {
            desc = `<div class="contributor-desc">${escapeHtml(c.description)}</div>`;
          }
        }

        return `
          <div class="contributor" id="${escapeHtml(c.slug || "")}">
            <span class="contributor-name">${escapeHtml(c.display_name || c.full_name)}</span>
            <span class="contributor-initials">(${escapeHtml(c.initials)})</span>
            <div style="color: var(--muted); font-size: 0.9rem;">${creds ? escapeHtml(creds.substring(2)) : ""}${creds ? " \u00b7 " : ""}${c.articles.length} article${c.articles.length !== 1 ? "s" : ""}</div>
            ${desc}
            <ul class="article-list">${articleLinks}</ul>
          </div>
        `;
      }).join("");
    }

    // An article byline links straight here: /contributors.html#<signature slug>.
    // The list is built after the fetch, so the element the browser wanted to jump
    // to did not exist when it tried — we do the jump ourselves once it does, and
    // again on hashchange (arriving from a byline while the page is already open).
    // An unknown slug is left alone: an old bookmark then shows the full roster
    // rather than an error, and the legacy ?q= links still prefill the search box.
    function focusHash() {
      const slug = decodeURIComponent((location.hash || "").slice(1));
      document.querySelectorAll(".contributor.targeted")
        .forEach(el => el.classList.remove("targeted"));
      if (!slug) return;
      const el = document.getElementById(slug);
      if (!el) return;
      el.classList.add("targeted");
      el.scrollIntoView({ block: "start" });
    }

    searchInput.addEventListener("input", render);
    window.addEventListener("hashchange", focusHash);

    // Load contributor data.  contributors.json is self-contained — this page
    // renders entirely from it — so we fetch ONLY that.  (Previously this also
    // fetched + parsed the 18.6MB index.json and threw it away, blocking the
    // render on a dead download; that was the whole ~1s page lag.)
    fetch("/data/articles/contributors.json")
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        contributorData = data;
        const totalArticles = contributorData.reduce((s, c) => s + c.articles.length, 0);
        statsEl.textContent = `${contributorData.length} contributors · ${totalArticles} attributed articles`;
        const urlQ = new URLSearchParams(location.search).get("q");
        if (urlQ && !location.hash) searchInput.value = urlQ;
        render();
        focusHash();
      })
      .catch(err => {
        statsEl.textContent = `Failed to load: ${err.message}`;
      });
  </script>
  <button class="nav-arrow" style="transform:translateY(-20px)" onclick="window.scrollTo({top:0,behavior:'instant'})" title="Top">&#x25B2;</button>
  <button class="nav-arrow" style="transform:translateY(12px)" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'instant'})" title="Bottom">&#x25BC;</button>
<script src="/gc-gate.js"></script>
<script data-goatcounter="https://@@analytics_code@@.goatcounter.com/count" async src="//gc.zgo.at/count.js" onload="if(window.__gcReady)__gcReady()"></script>
</body>
</html>
