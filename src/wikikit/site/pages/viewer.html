<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@@work_name@@, @@edition_label@@</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
  <style>
    :root {
      --bg: #f5f1eb;
      --panel: #fdfcf9;
      --text: #2c2416;
      --muted: #6b5e4f;
      --border: #d4cab8;
      --link: #7b3f00;
      --unresolved: #b42318;
      --resolved-bg: #f5f0e8;
      --unresolved-bg: #fff1f1;
      --code-bg: #f0ebe3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Cambria Math", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Plate pages have no marginal furniture (page numbers, shoulder
       headers) — drop the reading-column cap and give the viewport to
       the display.  Toggled by renderArticle on article_type==="plate". */
    body.plate-page .page {
      max-width: none;
      padding-left: 2vw;
      padding-right: 2vw;
    }

    /* Transliteration tooltip: the romanization of a Greek/Hebrew word, carried
       from the source's `<span title="…">` and shown on hover.  Dotted underline
       + help cursor signal it's hover-able (the print offered no such aid). */
    .xlit {
      border-bottom: 1px dotted currentColor;
      cursor: help;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .header-divider {
      text-align: center;
      color: #8b7355;
      font-size: 1.6rem;
      margin: -6px 0 14px;
      letter-spacing: 0.3em;
      user-select: none;
    }

    h1, h2, h3 {
      margin-top: 0;
      line-height: 1.2;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      font-variant: small-caps;
      letter-spacing: 0.06em;
      color: #2c2416;
    }

    .meta {
      color: var(--muted);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    input[type="text"] {
      flex: 1 1 380px;
      min-width: 240px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
      background: var(--panel);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #8b7355;
      box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.12);
    }

    button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      cursor: pointer;
      font: inherit;
    }

    button:hover { background: var(--code-bg); }

    .body-text {
      font-size: 1.08rem;
      margin-left: 6.5em;
      margin-right: 160px;
      position: relative;
      /* Contain floats: a float-right contributor signoff after a final
         TABLE has no following prose to sit beside, and without a BFC it
         hangs below the body block into the notes bar (CONSTELLATION).
         flow-root contains it without clipping the absolutely-positioned
         margin page-numbers (overflow:hidden would). */
      display: flow-root;
    }

    @media (max-width: 900px) {
      .body-text {
        margin-right: 0;
      }
    }

    /* The scans indent a new paragraph about two characters, and that indent is
       the ONLY signal the page gives — printed paragraphs carry no vertical gap.
       We keep the gap (a web convention that earns its keep on screen) and add
       the indent back, which is what this rule said until 2026-06-13: it was
       deleted as collateral in c9115a8, a commit about making produce_title the
       sole title decider, whose message never mentions the CSS.
       The first paragraph stays flush, as the printed page runs it on from the
       headword.
       NOT TRUE of a paragraph broken by a block: the producer emits <p> as a
       SEPARATOR, so a paragraph interrupted by display math resumes as its own
       <p> and takes an indent it should not (MENSURATION §24 (ii)), while a new
       item arriving straight after a table has no <p> at all and stays flush
       when it should indent.  CSS cannot tell the two apart — the discriminator
       is whether the text starts lowercase — and measurement rejects the one
       rule that might have: a <p> after a centred block is a continuation only
       21% of the time (1,482 of 7,028), so flushing them all would mis-set
       5,546 genuine paragraphs to fix 1,482.  This wants a producer fix. */
    .body-text p {
      text-indent: 1.5em;
      margin: 0 0 0.5em 0;
      position: relative;
    }

    /* `> p`, not `p`: `:first-of-type` is per PARENT, so the first paragraph of
       every NESTED block matched it too and went flush.  That was 100 of 3,573
       paragraphs in a 600-article sample, 98 of them the opening paragraph of a
       small-type extract — and vol 1 p. 390 shows the scan indenting every
       paragraph of such an extract, the first included. */
    .body-text > p:first-of-type {
      text-indent: 0;
    }

    /* An extract block opens with bare text rather than a <p>, so its first
       paragraph is unreachable from a `p` rule and the indent has to come from
       the block itself.  Safe: 293 of 293 such openings in the sample begin a
       new sentence, never a continuation.  In `em` it scales with the 83% type,
       which is what the scan's proportionally smaller indent does. */
    .body-text div[style*="font-size:83%"] {
      text-indent: 1.5em;
    }

    /* Where the SOURCE states its own indentation the indent is not ours to
       impose.  FIBRES wraps a hanging `text-indent:-2em` list whose paragraphs
       we were rendering at 0 and 1.5em — our value, twice, neither the
       source's. */
    .body-text [style*="text-indent"] p {
      text-indent: inherit;
    }

    /* Centred display material takes no paragraph indent: an indent shifts the
       centred line right.  The reset has to sit on the BLOCK, not just its <p> —
       MENSURATION centres a formula inside a small-type extract, so a `p` rule
       saying `inherit` would have picked up that extract's 1.5em. */
    .body-text .centered,
    .body-text .centered p {
      text-indent: 0;
    }

    /* A float is not prose, and `text-indent` INHERITS.  A floated figure box
       took the paragraph's indent and shifted its own image out of the box the
       text wraps around — PRIMULACEAE Fig. 2 stood 26px into the prose, which is
       exactly the 1.5em.  The legend inside it was pushed off centre by the same
       amount.  `.math-system` / `.section-heading` / `.shoulder-heading` already
       carry this reset for the same reason; the floats were never covered. */
    .body-text [style*="float"],
    .body-text .float-left,
    .body-text .float-right {
      text-indent: 0;
    }

    /* A carried `float:left` brings a width but no GUTTER, so the prose ran
       straight up against the cut.  The scan leaves about 1em beside it
       (vol 22 p. 341, Fig. 2), which is already what the class floats above use
       — so this is the same gutter, extended to the floats that carry their
       style inline.  A float that carries its OWN margin keeps it: an inline
       `margin` beats this rule. */
    .body-text [style*="float:left"],
    .body-text [style*="float: left"] {
      margin-right: 1em;
    }

    .body-text [style*="float:right"],
    .body-text [style*="float: right"] {
      margin-left: 1em;
    }


    .body-text .katex-display {
      text-indent: 0;
      max-width: 100%;
      /* Clipping as a safety net for any equation that escaped the
         build-time width measurement (new LaTeX added since the last
         `measure_math_widths.py` run).  Normal display math fits at
         natural size; wide math is pre-scaled via `«MATH[fs=N]:`
         hints (see `wikikit.math_widths`); really wide math uses
         the pop-out link (see `renderMathPopout`).  This `overflow:
         hidden` only matters for the uncached-residual case. */
      overflow: hidden;
    }
    /* Tier 2: scaled math.  `«MATH[fs=N]:` wraps the KaTeX render in
       a span with `font-size: N%`.  KaTeX em-based widths resolve to
       the smaller base so the math is rendered at the smaller size
       from initial paint (no thrash). */
    .math-scaled {
      display: inline-block;
    }
    /* Tier 3: popout link for math too wide to scale into the
       column.  Renders as an italic anchor; click opens the popout
       modal which renders at viewport-fitting font-size. */
    .math-popout-link {
      font-style: italic;
      color: #6b5a3f;
      text-decoration: underline dotted;
      cursor: zoom-in;
      font-size: 0.92em;
    }
    .math-popout-link:hover {
      color: #2c2416;
      background: #ebe4d6;
    }
    /* Standalone display-math context: render the popout link as a
       block element in the math column position, so it occupies the
       same visual slot the equation would have — centred, with
       display-math margins — rather than sitting inline within the
       surrounding prose paragraph.  An adjacent label (handled by
       the EQNGROUP renderer) still goes in the right-margin label
       column. */
    .math-popout-link.popout-display {
      display: block;
      text-align: center;
      margin: 1em 0;
    }
    .math-popout-modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 10, 0.6);
      z-index: 9100;
      padding: 2em;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .math-popout-panel {
      position: relative;
      max-width: calc(100vw - 4em);
      max-height: calc(100vh - 4em);
      background: var(--panel);
      border: 1px solid #c4b49a;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 2em 2.5em 1.5em;
      overflow: auto;
    }
    .math-popout-close {
      position: absolute;
      top: 6px;
      right: 8px;
      font: inherit;
      font-size: 1.1rem;
      line-height: 1;
      color: #8b7355;
      background: transparent;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
    }
    .math-popout-close:hover { background: #ddd4c4; color: #3a2f20; }
    .math-popout-host .katex-display {
      overflow: visible;
      margin: 0;
    }
    /* KaTeX auto-numbers rows of `\begin{align}` with CSS counters
       — that's a KaTeX-rendering convention, not anything in the
       1911 source.  No EB1911 article uses explicit `\tag{}`, so
       suppressing the auto-numbering entirely is the right call. */
    .katex .eqn-num,
    .katex .mml-eqn-num {
      display: none !important;
    }

    /* Numbered display equation(s).  Three-column grid: a flexible
       gutter on the left, the math content centred in the auto
       column, and the (N) label flush right.  `minmax(0, 1fr)` on
       the side gutters lets the math shrink rather than pushing the
       label off the page when an equation is unusually wide; very
       wide rows then scroll horizontally inside katex-display's
       overflow-x: auto (set on .body-text .katex-display).
       align-items: center on the grid puts the label at the
       vertical centre of the row stack, matching the original
       publication's rowspan-spanning label placement. */
    /* Math-system layout — flex with reserved label space so wide
       math can never overlap the (N) label.  The math-rows column
       claims the remaining space (flex:1 with min-width:0 so it can
       shrink below its content's natural width) and clips overflow.
       Earlier grid layout
       (`minmax(0,1fr) auto minmax(0,1fr)`) let the auto math column
       eat the 1fr label gutter when math was wider than the line. */
    .body-text .math-system {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin: 1em 0;
      text-indent: 0;
    }
    .body-text .math-system-rows {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.4em;
      align-items: center;
    }
    .body-text .math-system-rows .math-system-row {
      text-indent: 0;
      text-align: center;
      max-width: 100%;
    }
    /* Cancel KaTeX's default block margins so multi-row systems sit
       tight inside the flex column rather than picking up an extra
       1em of leading per row. */
    .body-text .math-system-rows .katex-display {
      margin: 0;
    }
    .body-text .math-system-label {
      flex: 0 0 auto;
      text-align: right;
      white-space: nowrap;
    }


    .xref-list {
      list-style: none;
      padding: 0;
      margin: 0;
      columns: 2;
      column-gap: 2em;
    }

    .xref-item {
      padding: 2px 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .xref-item.unresolved {
      color: var(--muted);
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      background: rgba(139, 115, 85, 0.08);
      border-radius: 2px;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 0.82rem;
      margin-left: 8px;
      vertical-align: middle;
    }

    .segments {
      display: grid;
      gap: 12px;
    }

    .segment {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      background: #fafbfc;
    }

    .segment-meta {
      color: var(--muted);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .message {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .error {
      color: var(--unresolved);
      background: var(--unresolved-bg);
      border-color: #f0c4c4;
    }

    code {
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }

    details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .article-image {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      background: var(--panel);
    }

    .article-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    .article-image figcaption {
      padding: 8px 10px;
      font-family: Georgia, "Times New Roman", "Cambria Math", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      font-size: 0.82rem;
      font-style: italic;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    .article-image figcaption.filename {
      color: var(--muted);
      font-size: 0.78rem;
      font-style: normal;
      word-break: break-all;
    }

    /* No blanket frame.  `border: 1px solid #c4b49a` boxed all 11,814 data
       tables in the UI CHROME tone (the same #c4b49a as modal edges, buttons and
       the wide-table scroll container) whether or not the printed table has a
       frame — and where the source DID draw its own rules, in currentColor, the
       two disagreed.  A frame is content: it comes from the source's own
       `_tablecolhdborder` / `_tablegridhdborder` classes, or from the Ts border
       codes it puts on individual cells. */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.93rem;
    }

    /* Chemistry-layout tables: spatial diagrams of 2-D reaction
       schemes (FULMINIC ACID, POLYMETHYLENES, …).  Strip the data-
       table chrome — no borders, no full-width stretch — and centre
       the grid like a math display.  Cells flow on a single text
       baseline so the angle-bracket valence glyphs (⟨ / ⟩) sit
       inline with atom labels and arrows. */
    .chem-grid {
      /* the engine renders a classed wikitable as "data-table chem-grid": the
         grid's own width, or .data-table's 100% stretches it across the column */
      width: auto;
      margin: 1em auto;
      border-collapse: collapse;
      border: none;
      font-size: 0.95rem;
      font-family: Georgia, "Times New Roman", serif;
    }
    .chem-grid td, .chem-grid th {
      border: none;
      padding: 0.1em 0.3em;
      vertical-align: middle;
      text-align: center;
      white-space: nowrap;
    }
    /* Internal-line variants of the valence chevron.  The Python
       emitter turns LangleIT.svg / RangleIT.svg into
       <span class="chem-bracket-it">❮</span> (or ❯), and the IB
       variant into <span class="chem-bracket-ib">…</span>.  The
       horizontal bar is drawn as a ::before pseudo-element so the
       glyph itself doesn't have to be a different Unicode point
       (none exists for these). */
    .chem-bracket-it, .chem-bracket-ib {
      display: inline-block;
      position: relative;
      line-height: 1;
      padding: 0 1px;
    }
    .chem-bracket-it::before {
      content: "";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      border-top: 1px solid currentColor;
    }
    .chem-bracket-ib::after {
      content: "";
      display: block;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-bottom: 1px solid currentColor;
    }

    /* Figure-tables = the author's class-less {| ("layout, not data").  The
       producer mints no class, so a figure is recognized by the ABSENCE of one,
       :not([class]), and no output attribute is added.  POSITION rides on the
       carried margin:auto / {{ts|ma}}; the viewer's ONLY opinions here are
       VIEWPORT-RESPONSIVE (cf. wide-table): the figure fills the reading column,
       a floated one takes half so prose wraps, the image scales -- plus the
       figure basics it owns: borders off, vertical breathing room, column gap. */
.body-text table:not([class]) {
      /* Top and bottom only.  `margin: 1.2em 0` also declared the SIDES as zero,
         and this rule outranks the float gutter, so a floated figure-table had
         the prose hard against its edge.  A table that carries its own
         `margin:auto` still wins — that is an inline style. */
      margin-top: 1.2em;
      margin-bottom: 1.2em;
      border-collapse: collapse;
      border: none;
      max-width: 100%;
    }
    /* A non-float figure fills the reading column.  A FLOAT honors its carried
       width:Npx — that's an inline style, so it beats this non-!important rule —
       and falls back to half-column only when the source carried no width, so the
       prose has room to wrap either way.  max-width:100% (above) still caps it.
       Only a table that HOLDS a figure: a table of text and figures keeps its own
       width, its columns as wide as their contents, and a table wider than the
       column scrolls in its frame (wrapWideTables) — forced to the column's
       width, a six-column schedule wrapped every cell into a few letters a line
       and its columns ran together (TIDE, 2026-10-13). */
    .body-text table:not([class]):not([style*="float"]):has(img) {
      width: 100% !important;
    }
.body-text table:not([class])[style*="float"] {
      width: 50%;
      /* Top and bottom only.  `margin: 0.4em 0` set the SIDES to zero too, and
         this rule outranks the float gutter below it, so every figure-table
         floated against the prose lost its 1em and the text ran up against the
         cut — 21 of the 162 floats in a 600-article sample. */
      margin-top: 0.4em;
      margin-bottom: 0.4em;
    }
.body-text table:not([class]) td,
.body-text table:not([class]) th {
      border: none;
      padding: 1px 12px;
    }
    /* An image carries NO layout of its own — its placement is its surrounding
       context (a «CTR» block, line-breaks, the table cell), per markers.py: "an
       image's layout is ... never a property of the image".  These are ONLY
       responsive caps.  Do NOT re-add display:block / margin:auto here — that made
       centering a property of the IMAGE, block-centering EVERY class-less-table
       image and so breaking inline glyphs (ABBREVIATIONS' per-symbol dropped onto
       its own centered line).  the baked render already centers align=center; the
       surrounding context centers the rest. */
.body-text table:not([class]):not([style*="float"]) img {
      max-height: none !important;
      max-width: 100% !important;
      height: auto;
    }
    /* An image that SHARES its row with a text cell (the chess end-game boards:
       a position beside its solution) must hold its OWN width.  Left shrinkable
       by max-width:100%, the auto-layout hands the width to the prose and
       squeezes the board to nothing; max-width:none makes it non-shrinkable, so
       the table reserves the board's column and the prose wraps in what's left.
       A board alone in its cell (:only-child) never hits this. */
    .body-text table:not([class]):not([style*="float"]) td:not(:only-child) img {
      max-width: none !important;
    }
    /* PLATE full-bleed: the source's fixed px (e.g. width:1000px, cell images
       at 450px) is the PRINT width.  On a plate page the column cap is gone
       (body.plate-page .page), so let the grid and its images fill the
       viewport — the table stretches and the cells scale proportionally,
       overriding formatCell's inline max-width:Npx cap (same !important
       pattern as the height cap above). */
    body.plate-page table:not([class]) {
      width: 100%;
    }
    body.plate-page table:not([class]) img {
      max-width: 100% !important;
      width: 100%;
    }

    /* Wide data tables: shown inline but horizontally scrollable, with an
       Expand button that pops them into a full-viewport modal. */
    .wide-table-wrap {
      margin: 1em 0;
      position: relative;
    }
    .wide-table-inline {
      overflow-x: auto;
      border: 1px solid #c4b49a;
      background: var(--panel);
    }
    .wide-table-inline .data-table {
      margin: 0;
      border: none;
      min-width: max-content;
    }
    /* A class-less table of text in the frame takes its natural width too: at
       auto width a table wider than the frame shrank to its NARROWEST layout,
       every cell wrapped to its longest word (TIDE's schedules, 2026-10-13).
       A table holding a figure still fills the column (above). */
    .wide-table-inline table:not([class]):not(:has(img)) {
      min-width: max-content;
      max-width: none;
    }
    .expand-table-btn {
      display: inline-block;
      font: inherit;
      font-size: 0.75rem;
      color: #8b7355;
      background: #ebe4d6;
      border: 1px solid #c4b49a;
      padding: 2px 10px;
      margin-bottom: 4px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .expand-table-btn:hover { background: #ddd4c4; }

    .wide-table-modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 10, 0.6);
      z-index: 9000;
      padding: 2em;
      box-sizing: border-box;
    }
    .wide-table-modal.fullscreen {
      padding: 0;
    }
    .wide-table-modal-panel {
      position: absolute;
      inset: 2em;
      display: flex;
      flex-direction: column;

      max-height: calc(100vh - 2em);

      inset: 0;
      border: none;
      border-radius: 0;

      max-height: 100vh;

      font-size: 1.1rem;

    }
    .wide-table-modal-body .data-table {
      margin: 0;
      min-width: max-content;
    }
    .wide-table-trailing {
      margin-top: 1em;
      font-size: 0.9rem;
      color: #555;
    }

    /* Tables are FAITHFUL to the scan: padding for legibility, no invented
       borders/shading.  The scans are mostly borderless and never shaded —
       alignment alone carries the structure. */
    .data-table td {
      padding: 5px 10px;
      vertical-align: top;
    }

    .data-table th {
      padding: 6px 10px;
      vertical-align: top;
      font-weight: normal;   /* scans show plain (not bold) headers */
    }

    /* `class="wikitable"` is a FULL GRID in MediaWiki -- render it as one.
       (AUSTRIA "Administrative Territories" reads as "header + total rules
       only" in the scan NOT because it's verticals-only, but because its data
       rows are <br>-collapsed into ONE row per column -- so a full grid draws
       rules around the two header rows, the single data block, and the total,
       with nothing between the <br> lines: exactly the scan.  The old
       verticals-only dropped those real header/total rules.) */
    .data-table.wikitable {
      border-collapse: collapse;
      border: 1px solid #c4b49a;          /* frame */
    }
    .data-table.wikitable td,
    .data-table.wikitable th {
      border: 1px solid #c4b49a;          /* full grid: the class MediaWiki renders */
    }

    /* `_tablecolhdborder` / `_tablegridhdborder` -- Wikisource's OWN bordered-table
       classes, carried on 758 of our tables and until now styled nowhere, so the
       rules they draw were simply lost.  Ported verbatim from the TemplateStyles
       en.wikisource serves with the page (fetched from
       Page:EB1911 - Volume 01.djvu/439):

         ._tablecolhdborder{border-collapse:collapse;border:1px solid;...}
         ._tablecolhdborder th{border-bottom:1px solid;border-left:1px solid}
         ._tablecolhdborder td{border-left:1px solid;padding-left:5px}

       This is where AGRICULTURE Table IX's full-height column rules come from:
       the transcriber marks only the HEADER cells with `{{Ts|ba}}` because the
       class draws a left rule on every body cell.  We drew neither, and framed
       the table in the UI chrome tone instead.
       `border:1px solid` with no colour is currentColor -- the same ink as the
       text, which is what the scans show.  Do not substitute the chrome tone. */
    .data-table._tablecolhdborder,
    .data-table._tablegridhdborder {
      border-collapse: collapse;
      border: 1px solid;
      margin-left: auto;
      margin-right: auto;
    }
    .data-table._tablecolhdborder th {
      border-bottom: 1px solid;
      border-left: 1px solid;
      text-align: center;
    }
    .data-table._tablecolhdborder td {
      border-left: 1px solid;
      padding-left: 5px;
    }
    .data-table._tablegridhdborder th {
      border-left: 1px solid;
      border-right: 1px solid;
      border-bottom: 1px solid;
      text-align: center;
    }
    .data-table._tablegridhdborder td {
      border-left: 1px solid;
      border-right: 1px solid;
      border-bottom: 1px solid;
      padding-left: 5px;
    }

    .small-caps {
      font-variant: small-caps;
    }

    /* Centered display block — `{{center|...}}` and variants.  Mostly
       used for math equations and decorative title blocks.  Paragraph-
       level centering via text-align on a wrapping div. */
    .centered {
      text-align: center;
      margin: 0.5em 0;
    }

    /* {{float right}}/{{float left}} — margin-floated inline content
       (contributor-initial signatures like "(A. P. C.)", right-floated
       marginal status notes). */
    .float-right { float: right; margin-left: 1em; }
    .float-left  { float: left;  margin-right: 1em; }

    /* A whole styling vocabulary is GONE, measured at 0 uses across 37,226
       rendered articles: `.sans-serif` / `.explicit-serif` (the «SS»/«SR»
       markers), the six `.size-*` steps (the «XXS»…«XXL»/«FS»/«LH» family),
       `.underline` («U»), `.brace2` («BRACE2»).  Nothing was lost with them —
       every one of those source constructs is still carried, by the STYLE-SPAN
       path, which arrives as an inline `style` carrying the source's own value
       ({{x-larger}} → font-size:144%) instead of a bucket name we had to invent.
       See markers.py for the full list and the measurement. */

    /* Horizontal rule — `{{bar|N}}` renders an N-em underline,
       typically for column-sum underlines in tables (AFRICA / GREAT
       BRITAIN territorial summaries). */
    .inline-bar {
      display: inline-block;
      border-bottom: 1px solid currentColor;
      vertical-align: middle;
    }

    /* Display horizontal rule (vertical spacer) — `{{dhr|N%}}` adds
       block-level vertical space between sections (ABBEY) or inline
       between list items in cells (AFRICA tribal tables). */
    .dhr-block {
      display: block;
      height: 1em;
    }
    .dhr-inline {
      display: inline-block;
      width: 0;
      height: 1em;
    }

    /* Horizontally mirrored glyph — source uses
       `<span style="{{mirrorH}}">…</span>` in ALPHABET to show
       left-right-flipped letters of early/regional alphabets
       (Etruscan, Italic, Cleonae's reversed E).  The pipeline emits
       «MIRROR:…«/MIRROR»; we apply transform: scaleX(-1) here. */
    .mirror-h {
      display: inline-block;
      transform: scaleX(-1);
    }

    .verse {
      font-family: Georgia, "Times New Roman", "Cambria Math", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      margin: 1em 2em;
      line-height: 1.6;
      text-align: left;
    }
    /* Inline/cell verse — a «VERSE» inside prose, a table cell, or a «CTR».
       Verse is flush-left BY DEFINITION, so its lines never inherit a container's
       centering; but a centred container (a «CTR» wrapper, a centred figure cell)
       may still center the verse block AS A UNIT.  inline-block makes those two
       independent: text-align:left flushes the lines, the block stays centerable. */
    .cell-verse {
      display: inline-block;
      text-align: left;
    }


    .page-marker {
      /* ABSOLUTE, not float — the twin of `.shoulder-heading` on the other
         margin.  A float is re-contained by whatever block it lands in, so a
         marker for a page that begins mid-table was trapped inside its `<td>`
         and could never reach the margin.  The DOM position now sets only the
         VERTICAL placement, so the marker can sit exactly where the break falls
         — mid-table included — and still render in the margin beside that row.

         It resolves against its nearest POSITIONED ancestor, which is
         `.body-text` only when the marker sits between blocks; in a paragraph
         it is `.body-text p`, and in a wide table `.wide-table-wrap`.  All
         three share `.body-text`'s left content edge (`p` has `margin-left: 0`,
         `.wide-table-wrap` has `margin: 1em 0`), so `-7em` lands in the same
         margin whichever one wins.  `.body-text`'s `flow-root` comment already
         says it must not clip "the absolutely-positioned margin page-numbers";
         `.wide-table-inline`'s `overflow-x` does not clip either, because the
         containing block is its PARENT, outside the scroll box. */
      position: absolute;
      left: -7em;
      width: 5.5em;
      text-align: right;
      font-family: Georgia, "Times New Roman", "Cambria Math", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      font-size: 0.65rem;
      font-style: italic;
      color: #8b7355;
      padding-right: 1em;
      font-variant-numeric: tabular-nums;
      user-select: none;
      text-decoration: none;
    }
    /* The 'vol:page' label is generated content, so it is excluded from
       in-article / browser find and from textContent — the marker is furniture,
       not searchable text (a search for 'an oath' matches across the break). */
    .page-marker::after {
      content: attr(data-vol) ":" attr(data-page);
    }
    a.page-marker:hover {
      color: var(--link);
      text-decoration: underline;
    }

    .page-marker.unproofed {
      color: #d04000;
      font-weight: 700;
    }
    a.page-marker.unproofed:hover {
      color: #b42318;
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .body-text { margin-left: 0; }
      .page-marker { display: none; }
    }

    .footnote-ref {
      position: relative;
      display: inline;
    }

    .footnote-ref a {
      color: #7b3f00;
      text-decoration: none;
      /* Absolute size so a body/cell footnote ref renders identically — but the
         title H1 is the EXCEPTION (rule below), where the ref scales to title font. */
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0 2px;
      cursor: pointer;
    }

    /* EXCEPTION (title footnote): the ref NUMBER in the title H1 renders in TITLE
       font — a title-proportional superscript (1em inherits the heading size) —
       not the body 0.8rem.  The note popup (.fn-popup) keeps its standard 0.85rem,
       so the on-click note stays in normal footnote font. */
    h1 .footnote-ref a {
      font-size: 1em;
    }

    .fn-popup {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      max-width: 80vw;
      max-height: 200px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid #8b7355;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 200;
      /* Full context reset: a title-footnote popup lives inside the h1's «B» (bold)
         + small-caps + letter-spacing, yet the note must read as ordinary footnote
         prose.  letter-spacing was the last leak — the h1's 0.06em spread made the
         note look heavier ("bold") though its weight is already normal (confirmed via
         getComputedStyle: weight 400, only letterSpacing differed). */
      font-style: normal;
      font-variant: normal;
      font-weight: normal;
      letter-spacing: normal;
      text-indent: 0;
      text-transform: none;
    }

    /* Lists the SOURCE marks as lists — `#`, <ol>, {{ordered list}} (EGYPT's
       population groups, HERCULES's twelve labours, GEOLOGY's A/B/C, ALBUMIN's
       roman-numbered proteins).  The marker carries the numbering as the list's
       own `list-style-type`, so the browser numbers the items: the numeral is
       structure, not text.  It used to be MINTED into the item ("I. ", "A. ")
       and the list drawn with `list-style-type:none`, which made the numeral
       prose and the list not a list.  A `:`-indented paragraph is NOT here — it
       is an indent, carried as one. */
    .body-text ol,
    .body-text ul {
      margin: 1em 0;
      padding-left: 2.2em;
    }
    .body-text ol ol,
    .body-text ol ul,
