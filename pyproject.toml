[project]
name = "wikikit"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Build faithful digital editions of reference works transcribed at Wikisource"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  # The PostgreSQL driver behind `postgresql+psycopg://` database URLs.
  "psycopg[binary]>=3.1",
  "mwparserfromhell>=0.7.2",
  # HTML5-spec parser/serializer (parse5-equivalent).  The render parses the
  # producer's HTML-table wire format to recurse cells, and normalizes rendered
  # output to browser-equivalent HTML (golden diff + EPUB XHTML).
  "html5lib>=1.1",
  # Local ONNX embeddings (BAAI/bge-small-en-v1.5) for the topic-link fisher's
  # semantic score.  Build-time only, no key, deterministic.
  "fastembed>=0.3",
  "numpy>=1.26",
  # Image sizes for the EPUB.  Declared, not left to arrive through fastembed.
  "pillow>=10",
]

[project.scripts]
wikikit = "wikikit.cli.main:run"

[project.optional-dependencies]
mdx = ["mdict-utils==1.3.14"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wikikit.mdx" = ["sample.json", "windows/*.cs", "mdx-title-search.cjs",
                 "installer/*.cjs", "installer/*.json", "installer/Install.command",
                 "installer/.gitignore"]
"wikikit.diagnostics" = ["tei_all.rng"]
"wikikit.site" = ["pages/*.html", "pages/*.js"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
]
